<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tool Pencari Data Site</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
input[type="text"] { padding: 8px; width: 200px; }
button { padding: 8px 12px; cursor: pointer; }
#results { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
.data-item { margin-bottom: 5px; }
.label { font-weight: bold; }
</style>
</head>
<body>
<h2>Pencari Data Site</h2>
<input type="file" id="file1" accept=".xlsx, .xls"> File 1 (Expansion)


<input type="file" id="file2" accept=".xlsx, .xls"> File 2 (Material BOQ)


<input type="text" id="siteIdInput" placeholder="Masukkan Site ID...">
<button onclick="cariData()">Cari</button>
<div id="results"></div>
<script>
let dataSite = [];
async function bacaFile(file) {
return new Promise((resolve) => {
const reader = new FileReader();
reader.onload = (e) => {
const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data, {type: 'array'});
const sheetName = workbook.SheetNames[0];
const sheet = workbook.Sheets[sheetName];
const json = XLSX.utils.sheet_to_json(sheet);
resolve(json);
};
reader.readAsArrayBuffer(file);
});
}
async function gabungkanData() {
const file1 = document.getElementById('file1').files[0];
const file2 = document.getElementById('file2').files[0];
if (!file1 || !file2) {
alert('Pilih kedua file terlebih dahulu!');
return;
}
const data1 = await bacaFile(file1);
const data2 = await bacaFile(file2);
dataSite = data1.map(item1 => {
const item2 = data2.find(i2 => i2['Site ID'] === item1['Site ID']) || {};
return { ...item1, ...item2 };
});
alert('Data berhasil dimuat dan digabungkan!');
}
document.getElementById('file1').addEventListener('change', gabungkanData);
document.getElementById('file2').addEventListener('change', gabungkanData);
function cariData() {
const siteId = document.getElementById('siteIdInput').value.trim();
const resultsDiv = document.getElementById('results');
resultsDiv.innerHTML = '';
if (dataSite.length === 0) {
alert('Tunggu proses penggabungan data selesai!');
return;
}
const hasil = dataSite.find(item => item['Site ID'] === siteId);
if (hasil) {
for (const key in hasil) {
const div = document.createElement('div');
div.className = 'data-item';
div.innerHTML = <span class="label">${key}:</span> ${hasil[key]};
resultsDiv.appendChild(div);
}
} else {
resultsDiv.innerHTML = 'Data tidak ditemukan.';
}
}
</script>
</body>
</html>
